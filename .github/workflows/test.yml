name: multi-round verification
on: [push, pull_request]
jobs:
  python-matrix:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev]'
      - name: Unit, regression, ACL, MCP and deterministic fuzz
        run: python -m pytest -q
      - name: Resource-warning strict regression
        run: python -W error::ResourceWarning -m pytest -q
      - name: Bytecode compile sanity
        run: python -m compileall -q src examples
      - name: Cross-process A2A + HTTP + Node.js + Skills
        run: python tests/smoke_network.py
      - name: Forced process crash / lease recovery
        run: python tests/chaos_network.py
      - name: Multi-client HTTP load and workflow fan-out
        run: python tests/stress_http.py
