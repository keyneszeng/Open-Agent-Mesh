[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-agent-mesh"
version = "0.4.0"
description = "Framework-neutral multi-agent task mesh with a partial A2A 1.0 JSON-RPC bridge"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.25,<1", "httpx>=0.26,<1", "pydantic>=2,<3"]
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.26"]

[project.scripts]
agentmesh = "agentmesh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
